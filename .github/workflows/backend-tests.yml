name: CI

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/backend-tests.yml'

# Cancel in-progress runs for the same branch on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci --prefer-offline

      - name: Run ESLint
        working-directory: server
        run: npx eslint src/ --ext .js --max-warnings 0

  test:
    name: Jest + Supertest (Node 20)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: campus_lost_found_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgresql://testuser:testpass@localhost:5432/campus_lost_found_test
      TEST_DATABASE_URL: postgresql://testuser:testpass@localhost:5432/campus_lost_found_test
      JWT_SECRET: ci_test_jwt_secret_do_not_use_in_production
      JWT_EXPIRES_IN: 1d
      ALLOWED_EMAIL_DOMAINS: eleve.isep.fr,isep.fr
      CLIENT_ORIGIN: http://localhost:5173
      UPLOAD_DIR: ./uploads
      MAX_FILE_SIZE_MB: 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci --prefer-offline

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Push schema to database
        working-directory: server
        run: npx prisma db push --accept-data-loss

      - name: Seed reference data
        working-directory: server
        run: node prisma/seed.js

      - name: Run tests with coverage
        working-directory: server
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: server/coverage/
          retention-days: 14

      - name: Coverage summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summaryPath = 'server/coverage/coverage-summary.json';
            if (!fs.existsSync(summaryPath)) return;
            const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
            const total = summary.total;
            const pct = (key) => total[key].pct;
            await core.summary
              .addHeading('Coverage Summary')
              .addTable([
                [{data: 'Statements', header: true}, {data: 'Branches', header: true}, {data: 'Functions', header: true}, {data: 'Lines', header: true}],
                [`${pct('statements')}%`, `${pct('branches')}%`, `${pct('functions')}%`, `${pct('lines')}%`]
              ])
              .write();
